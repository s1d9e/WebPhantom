[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webphantom"
version = "0.1.0"
description = "Browser forensics decoder - Recover web activity from dead machines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "s1d9e" }
]
keywords = ["forensics", "browser", "security", "dfir", "osint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
webphantom = "webphantom.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webphantom"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
